<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyStore & Staff System</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .nav-link { transition: all 0.2s ease-in-out; }
        .nav-link:hover { opacity: 0.85; }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-2">
        <div class="container">
            <!-- Logo / Brand Name -->
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{% url 'home' %}">
                <span class="fs-4">📦</span>
                <span>MyStore & Staff</span>
            </a>

            <!-- Mobile Toggle Button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation Links & Action Buttons -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="ms-auto d-flex align-items-center flex-wrap gap-2 mt-2 mt-lg-0">
                    
                    <!-- 1. ปุ่ม Admin ขึ้นก่อนตามโจทย์ -->
                    <a class="btn btn-primary btn-sm px-3 shadow-sm d-flex align-items-center gap-1 fw-semibold" href="/admin/" target="_blank">
                        <i class="bi bi-gear-fill"></i> เข้าหน้า Admin
                    </a>

                    <div class="vr bg-secondary mx-1 d-none d-lg-block" style="height: 24px; opacity: 0.5;"></div>

                    <!-- 2. เมนูตัวเลือกอื่นๆ -->
                    <a class="btn btn-outline-light btn-sm px-3 d-flex align-items-center gap-1" href="{% url 'home' %}">
                        <i class="bi bi-house-door-fill"></i> หน้าหลัก
                    </a>

                    <a class="btn btn-outline-light btn-sm px-3 d-flex align-items-center gap-1" href="{% url 'product_list' %}">
                        <i class="bi bi-cart-fill"></i> จัดการสินค้า
                    </a>

                    <a class="btn btn-outline-light btn-sm px-3 d-flex align-items-center gap-1" href="{% url 'employee_list' %}">
                        <i class="bi bi-people-fill"></i> จัดการพนักงาน
                    </a>

                    <a class="btn btn-success btn-sm px-3 shadow-sm d-flex align-items-center gap-1 fw-semibold" href="{% url 'product_create' %}">
                        <i class="bi bi-plus-circle-fill"></i> เพิ่มสินค้า
                    </a>

                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container my-4">
        <div class="bg-white p-4 p-md-5 rounded-4 shadow-sm border">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
