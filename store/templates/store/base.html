<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบจัดการ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'product_list' %}">📦 MyStore & Staff</a>
            <div class="ms-auto d-flex align-items-center">
                <a class="btn btn-outline-light btn-sm me-2" href="{% url 'product_list' %}">🛒 จัดการสินค้า</a>
                <a class="btn btn-outline-warning btn-sm me-2" href="{% url 'employee_list' %}">👨‍💼 จัดการพนักงาน</a>
                <a class="btn btn-success btn-sm me-2" href="{% url 'product_create' %}">+ เพิ่มสินค้า</a>
                <!-- ปุ่มเข้าหน้า Admin ที่เพิ่มเข้ามา -->
                <a class="btn btn-primary btn-sm" href="/admin/" target="_blank">⚙️ เข้าหน้า Admin</a>
            </div>
        </div>
    </nav>
    <div class="container bg-white p-4 shadow-sm rounded">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
