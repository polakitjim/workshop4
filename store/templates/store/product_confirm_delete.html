{% extends 'store/base.html' %}
{% block content %}
<div class="alert alert-danger mt-4 text-center p-5 shadow-sm">
    <h3 class="mb-4">⚠️ คุณแน่ใจหรือไม่ที่จะลบ "{{ product.name }}" ?</h3>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger btn-lg px-5">ยืนยันการลบ</button>
        <a href="{% url 'product_list' %}" class="btn btn-secondary btn-lg px-5">ยกเลิก</a>
    </form>
</div>
{% endblock %}
