{% extends 'store/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h3 class="mb-4 text-center">{{ action }}</h3>
        <form method="POST" enctype="multipart/form-data" class="border p-4 rounded bg-light">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-success px-4">บันทึกข้อมูล</button>
                <a href="{% url 'product_list' %}" class="btn btn-secondary px-4">ยกเลิก</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
